<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rutina en casa sin equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --tinta: #2a2238; --crema: #fff8ec; --amarillo: #ffd23f; --rojo: #ff4d6d; --verde: #3ec8a0; --azul: #4f8fff; --naranja: #ff8a3d; --lila: #b48cff; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body { font-family: 'Baloo 2', system-ui, sans-serif; color: var(--tinta); background: var(--crema); background-image: radial-gradient(circle, rgba(42,34,56,.07) 1.5px, transparent 2px); background-size: 12px 12px; user-select: none; -webkit-user-select: none; }
  .pant { max-width: 520px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 96px; }
  .pant[hidden] { display: none; }
  h1 { font-size: 30px; line-height: .95; font-weight: 800; color: var(--verde); -webkit-text-stroke: 1.5px var(--tinta); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--tinta); letter-spacing: .5px; }
  h1 span { color: var(--amarillo); display: block; }
  .sub { font-weight: 700; font-size: 14px; opacity: .7; margin: 6px 0 12px; }
  .lab { font-weight: 800; font-size: 13px; letter-spacing: 1px; opacity: .65; margin: 14px 0 6px; }
  .caja { background: #fff; border: 3px solid var(--tinta); border-radius: 16px; box-shadow: 0 4px 0 var(--tinta); padding: 10px 12px; }
  .fila { display: flex; gap: 8px; align-items: center; }
  .dato { flex: 1; text-align: center; } .dato b { display: block; font-size: 25px; line-height: 1.05; } .dato small { font-weight: 800; font-size: 11px; opacity: .6; letter-spacing: .5px; }
  .btn { display: block; width: 100%; text-align: center; font: 800 21px/1 'Baloo 2', system-ui; color: #fff; background: var(--verde); border: 4px solid var(--tinta); border-radius: 16px; box-shadow: 0 5px 0 var(--tinta); padding: 12px 0 8px; margin-top: 14px; cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--tinta); }
  .btn.blanco { background: #fff; color: var(--tinta); } .btn.rojo { background: var(--rojo); } .btn.chico { font-size: 16px; padding: 9px 0 6px; margin-top: 8px; border-width: 3px; box-shadow: 0 4px 0 var(--tinta); }
  .link { text-align: center; font-weight: 800; font-size: 14px; margin-top: 12px; text-decoration: underline; cursor: pointer; }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .op { background: #fff; border: 3px solid var(--tinta); border-radius: 14px; box-shadow: 0 3px 0 var(--tinta); padding: 8px 10px; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer; line-height: 1.1; }
  .op.sel { background: var(--amarillo); }
  .op i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--tinta); flex: none; }
  .segm { display: flex; gap: 6px; } .segm div { flex: 1; text-align: center; border: 3px solid var(--tinta); border-radius: 12px; padding: 7px 0 4px; font-weight: 800; font-size: 14px; background: #fff; cursor: pointer; }
  .segm .sel { background: var(--verde); color: #fff; }
  .num { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .num button { width: 34px; height: 34px; border: 3px solid var(--tinta); border-radius: 50%; background: var(--amarillo); font: 800 20px/1 'Baloo 2'; cursor: pointer; padding-top: 3px; }
  .num b { font-size: 24px; min-width: 56px; text-align: center; }
  .barra { height: 14px; border: 3px solid var(--tinta); border-radius: 10px; background: #fff; overflow: hidden; } .barra i { display: block; height: 100%; background: var(--verde); }
  .dia { display: flex; align-items: center; gap: 10px; border: 3px solid var(--tinta); border-radius: 14px; background: #fff; padding: 7px 10px; margin-bottom: 7px; box-shadow: 0 3px 0 var(--tinta); cursor: pointer; }
  .dia .n { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--tinta); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex: none; }
  .dia .t { flex: 1; line-height: 1.1; } .dia .t b { font-size: 16px; } .dia .t small { display: block; font-weight: 700; font-size: 12px; opacity: .65; }
  .dia.hecho .n { background: var(--verde); color: #fff; } .dia.hoy { background: var(--amarillo); } .dia.desc { opacity: .55; cursor: default; box-shadow: none; }
  .ok { font-weight: 800; color: var(--verde); font-size: 13px; }
  .ej { display: flex; gap: 10px; align-items: center; border-bottom: 2px dashed rgba(42,34,56,.2); padding: 7px 0; }
  .ej .fig { flex: none; background: #fff; border: 3px solid var(--tinta); border-radius: 12px; width: 64px; height: 66px; }
  .ej b { font-size: 16px; display: block; line-height: 1.1; } .ej small { font-weight: 700; opacity: .65; font-size: 13px; }
  .tag { font-size: 11px; font-weight: 800; background: var(--azul); color: #fff; border-radius: 8px; padding: 1px 6px; margin-left: 4px; vertical-align: 2px; }
  .semanas { display: flex; gap: 6px; margin-bottom: 10px; } .semanas div { flex: 1; text-align: center; border: 3px solid var(--tinta); border-radius: 12px; padding: 5px 0 2px; font-weight: 800; font-size: 13px; background: #fff; cursor: pointer; }
  .semanas .sel { background: var(--tinta); color: var(--crema); } .semanas .hecha { background: #c9f2e4; }
  /* barra de abajo */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--crema); border-top: 3px solid var(--tinta); display: flex; padding: 6px 6px max(6px, env(safe-area-inset-bottom)); z-index: 5; }
  nav div { flex: 1; text-align: center; font-weight: 800; font-size: 13px; padding: 6px 0 3px; border-radius: 12px; cursor: pointer; letter-spacing: .5px; }
  nav div.sel { background: var(--amarillo); border: 3px solid var(--tinta); padding: 3px 0 0; }
  nav[hidden] { display: none; }
  /* entrenamiento en curso */
  #juego { position: fixed; inset: 0; background: var(--crema); z-index: 10; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); }
  #juego[hidden] { display: none; }
  #juego .top { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; }
  #jFig { flex: 1; min-height: 0; background: #fff; border: 4px solid var(--tinta); border-radius: 20px; box-shadow: 0 5px 0 var(--tinta); margin: 8px 0 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  #jFig svg { height: 100%; width: auto; max-width: 100%; }
  #jFig .fase { position: absolute; top: 8px; left: 10px; font-weight: 800; font-size: 14px; background: var(--amarillo); border: 3px solid var(--tinta); border-radius: 10px; padding: 1px 8px 0; }
  #jNom { font-size: 30px; text-align: center; font-weight: 800; line-height: 1; color: var(--verde); -webkit-text-stroke: 1.5px var(--tinta); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--tinta); margin-top: 6px; }
  #jCnt { font-size: 64px; font-weight: 800; text-align: center; line-height: 1; margin-top: 2px; }
  #jCnt small { font-size: 26px; opacity: .55; }
  #jComo { font-weight: 700; font-size: 14px; line-height: 1.3; text-align: center; opacity: .8; min-height: 36px; }
  #juego .fila .btn { margin-top: 8px; font-size: 18px; white-space: nowrap; min-width: 0; }
  #juego .fila .btn.chico { font-size: 14px; }
  #juego.descanso { background: #dff6ee; }
  .anillo { width: 120px; height: 120px; margin: 0 auto; position: relative; } .anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); } .anillo b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 44px; }
  /* informe */
  .graf { width: 100%; display: block; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-weight: 800; font-size: 12px; }
  .cal span { padding: 4px 0 2px; border-radius: 8px; } .cal .si { background: var(--verde); color: #fff; } .cal .hoy { outline: 3px solid var(--tinta); } .cal .cab { opacity: .5; font-size: 11px; }
  .modal { position: fixed; inset: 0; background: rgba(42,34,56,.6); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal[hidden] { display: none; }
  .modal .caja { width: min(420px, 100%); }
  .aviso-salud { font-size: 11.5px; font-weight: 600; opacity: .7; margin-top: 14px; line-height: 1.25; text-align: center; }
</style>
</head>
<body>

<!-- ───────── BIENVENIDA / PERFIL ───────── -->
<div class="pant" id="pPerfil" hidden>
  <h1><span data-t="u.titulo1" style="display:inline;color:inherit"></span> <span data-t="u.titulo2"></span></h1>
  <div class="sub" id="perfilSub"></div>
  <div class="caja">
    <div class="fila" style="justify-content:space-between"><b data-t="p.edad"></b><div class="num" data-k="edad" data-min="13" data-max="90" data-paso="1"><button>−</button><b></b><button>+</button></div></div>
    <div class="fila" style="justify-content:space-between;margin-top:6px"><b data-t="p.peso"></b><div class="num" data-k="peso" data-min="35" data-max="200" data-paso="0.5"><button>−</button><b></b><button>+</button></div></div>
    <div class="fila" style="justify-content:space-between;margin-top:6px"><b data-t="p.altura"></b><div class="num" data-k="altura" data-min="120" data-max="220" data-paso="1"><button>−</button><b></b><button>+</button></div></div>
    <div class="fila" style="justify-content:space-between;margin-top:8px"><b data-t="p.sexo"></b><div class="segm" id="sexo" style="width:170px"><div data-v="H" data-t="p.hombre"></div><div data-v="M" data-t="p.mujer"></div></div></div>
  </div>
  <div class="lab" data-t="p.objetivo"></div>
  <div class="opciones" id="objetivos"></div>
  <div class="lab" data-t="p.diasSem"></div>
  <div class="segm" id="diasSem"><div data-v="2">2</div><div data-v="3">3</div><div data-v="4">4</div><div data-v="5">5</div><div data-v="6">6</div></div>
  <div class="lab" data-t="p.nivel"></div>
  <div class="segm" id="nivel"><div data-v="0" data-t="niv.0"></div><div data-v="1" data-t="niv.1"></div><div data-v="2" data-t="niv.2"></div></div>
  <div class="caja" style="margin-top:10px;font-weight:700;font-size:14px;line-height:1.3" id="pruebaTxt" data-t="p.pruebaTxt"></div>
  <div class="btn blanco chico" id="btnPrueba" data-t="p.hacerPrueba"></div>
  <div class="btn" id="btnGuardarPerfil" data-t="p.armar"></div>
  <div class="aviso-salud" data-t="p.datosLocal"></div>
</div>

<!-- ───────── PLAN ───────── -->
<div class="pant" id="pPlan" hidden>
  <div class="lab" style="margin-top:0" data-t="p.tuPlan"></div>
  <h1 id="planTit"></h1>
  <div class="sub" id="planSub"></div>
  <div class="segm" id="planNivel" style="margin-bottom:10px"><div data-v="0" data-t="niv.0"></div><div data-v="1" data-t="niv.1"></div><div data-v="2" data-t="niv.2"></div></div>
  <div class="semanas" id="semanas"></div>
  <div class="fila" style="margin-bottom:8px"><b style="font-size:15px" id="semTit"></b><div class="barra" style="flex:1"><i id="semBar"></i></div><b style="font-size:14px" id="semCnt"></b></div>
  <div id="listaDias"></div>
  <div class="btn" id="btnHoy"></div>
</div>

<!-- ───────── DETALLE DEL DÍA ───────── -->
<div class="pant" id="pDia" hidden>
  <div class="link" style="text-align:left;margin:0 0 6px" id="volverPlan" data-t="p.volver"></div>
  <div class="lab" style="margin-top:0" id="diaLab"></div>
  <h1 id="diaTit"></h1>
  <div class="sub" id="diaSub"></div>
  <div id="diaLista"></div>
  <div class="btn" id="btnEmpezarDia" data-t="p.empezar"></div>
</div>

<!-- ───────── INFORME ───────── -->
<div class="pant" id="pInforme" hidden>
  <h1><span data-t="p.informe1" style="display:inline;color:inherit"></span> <span data-t="p.informe2"></span></h1>
  <div class="sub" id="infSemana"></div>
  <div class="caja fila">
    <div class="dato"><b style="color:var(--naranja)" id="iKcal">0</b><small data-t="p.kcal"></small></div>
    <div class="dato"><b style="color:var(--verde)" id="iMin">0</b><small data-t="p.minutos"></small></div>
    <div class="dato"><b style="color:var(--azul)" id="iSes">0</b><small data-t="p.sesiones"></small></div>
    <div class="dato"><b style="color:var(--rojo)" id="iRacha">0</b><small data-t="p.racha"></small></div>
  </div>
  <div class="lab" data-t="p.kcalDia"></div>
  <div class="caja" style="padding:6px 8px"><svg class="graf" id="gKcal" viewBox="0 0 330 150"></svg></div>
  <div class="lab" data-t="p.oms"></div>
  <div class="caja"><div class="fila"><div class="barra" style="flex:1;height:18px"><i id="iOmsB"></i></div><b id="iOms" style="font-size:15px"></b></div></div>
  <div class="lab" data-t="p.pesoT"></div>
  <div class="caja" style="padding:8px"><svg class="graf" id="gPeso" viewBox="0 0 330 140"></svg>
    <div class="fila" style="margin-top:4px"><div style="flex:1;font-weight:800;font-size:14px" id="iImc"></div><div class="btn chico" style="width:auto;padding:8px 14px 5px;margin:0" id="btnPeso" data-t="p.anotarPeso"></div></div></div>
  <div class="lab" data-t="p.esteMes"></div>
  <div class="caja"><div class="cal" id="iCal"></div></div>
  <div class="lab" data-t="p.progreso"></div>
  <div class="caja" style="font-weight:700;font-size:14px;line-height:1.4" id="iProg"></div>
  <div class="lab" data-t="p.total"></div>
  <div class="caja fila">
    <div class="dato"><b id="tSes">0</b><small data-t="p.sesiones"></small></div>
    <div class="dato"><b id="tMin">0</b><small data-t="p.minutos"></small></div>
    <div class="dato"><b id="tKcal">0</b><small data-t="p.kcal"></small></div>
  </div>
  <div class="aviso-salud" data-t="p.kcalNota"></div>
</div>

<!-- ───────── PERFIL (ajustes) ───────── -->
<div class="pant" id="pAjustes" hidden>
  <h1><span data-t="p.mi1" style="display:inline;color:inherit"></span> <span data-t="p.mi2"></span></h1>
  <div class="sub" data-t="p.ajSub"></div>
  <div class="caja" id="ajResumen" style="font-weight:700;font-size:15px;line-height:1.5"></div>
  <div class="btn" id="btnEditarPerfil" data-t="p.editar"></div>
  <div class="lab" data-t="p.voz"></div>
  <div class="segm" id="voz"><div data-v="1" data-t="p.conVoz"></div><div data-v="0" data-t="p.sinVoz"></div></div>
  <div class="lab" data-t="p.descEntre"></div>
  <div class="segm" id="desc"><div data-v="-5" data-t="p.masCorto"></div><div data-v="0" data-t="p.normal"></div><div data-v="10" data-t="p.masLargo"></div></div>
  <div class="btn rojo chico" id="btnBorrar" style="margin-top:22px" data-t="p.borrar"></div>
  <div class="btn blanco chico" id="btnEntrenador" data-t="u.cambiarEntrenador"></div>
</div>

<nav id="nav" hidden>
  <div data-p="pPlan" class="sel" data-t="p.navPlan"></div>
  <div data-p="pInforme" data-t="p.navInforme"></div>
  <div data-p="juegos" data-t="p.navJuegos"></div>
  <div data-p="pAjustes" data-t="p.navPerfil"></div>
</nav>

<!-- ───────── ENTRENAMIENTO EN CURSO ───────── -->
<div id="juego" hidden>
  <div class="top"><span id="jPaso"></span><span id="jReloj">0:00</span></div>
  <div class="barra" style="margin-top:6px"><i id="jBar"></i></div>
  <div id="jNom"></div>
  <div id="jFig"><span class="fase" id="jFase"></span></div>
  <div id="jCnt"></div>
  <div id="jComo"></div>
  <div class="fila"><div class="btn blanco" id="jAtras" style="flex:0 0 58px">‹</div><div class="btn blanco" id="jPausa" style="flex:1" data-t="p.pausa"></div><div class="btn rojo" id="jSig" style="flex:1.3">LISTO</div></div>
  <div class="fila"><div class="btn blanco chico" id="jCambiar" data-t="p.cambiar"></div><div class="btn blanco chico" id="jSalir" data-t="p.salir"></div></div>
</div>

<div class="modal" id="mFin" hidden><div class="caja" style="text-align:center">
  <h1 style="font-size:30px"><span data-t="p.fin1" style="display:inline;color:inherit"></span> <span data-t="p.fin2"></span></h1>
  <div class="caja fila" style="margin-top:12px;box-shadow:none">
    <div class="dato"><b style="color:var(--verde)" id="fMin">0</b><small data-t="p.minutos"></small></div>
    <div class="dato"><b style="color:var(--naranja)" id="fKcal">0</b><small data-t="p.kcal"></small></div>
    <div class="dato"><b style="color:var(--azul)" id="fEj">0</b><small data-t="p.ejercicios"></small></div>
  </div>
  <div style="font-weight:800;margin-top:10px" data-t="p.como"></div>
  <div class="segm" id="fSens" style="margin-top:6px"><div data-v="-1" data-t="p.facil"></div><div data-v="0" class="sel" data-t="p.justo"></div><div data-v="1" data-t="p.dificil"></div></div>
  <div class="btn" id="btnFinOk" data-t="p.verInforme"></div>
</div></div>

<div class="modal" id="mPeso" hidden><div class="caja" style="text-align:center">
  <h1 style="font-size:28px"><span data-t="p.anotar1" style="display:inline;color:inherit"></span> <span data-t="p.anotar2"></span></h1>
  <div class="num" style="justify-content:center;gap:14px;margin-top:14px" id="pesoNum"><button>−</button><b style="font-size:34px"></b><button>+</button></div>
  <div class="btn" id="btnPesoOk" data-t="p.guardar"></div>
  <div class="link" id="btnPesoNo" data-t="p.cancelar"></div>
</div></div>

<script src="../textos.js"></script>
<script src="../voz.js"></script>
<script>
const $ = id => document.getElementById(id);
const P_ = (k, v) => RC.t('p', k, v);
RC.aplicar();
const leer = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const hoyStr = (d = new Date()) => d.toLocaleDateString('sv');

// ───────── PERSONAJE CÓMIC (dibujado con código) ─────────
// cada pose: cabeza, hombros, cadera, rodillas, pies y manos; las animaciones van de la pose A a la B
const POSES = {
  pie:   { cab: [60, 24], hom: [60, 44], cad: [60, 78], rodI: [55, 100], rodD: [65, 100], pieI: [54, 122], pieD: [66, 122], manI: [47, 72], manD: [73, 72] },
  lado:  { cab: [58, 24], hom: [58, 44], cad: [57, 78], rodI: [60, 100], rodD: [58, 100], pieI: [60, 122], pieD: [56, 122], manI: [64, 72], manD: [60, 74] },
  plancha: { cab: [22, 86], hom: [34, 92], cad: [70, 100], rodI: [90, 108], rodD: [90, 109], pieI: [110, 118], pieD: [110, 119], manI: [34, 122], manD: [36, 122] },
  acostado: { cab: [18, 112], hom: [30, 114], cad: [64, 116], rodI: [86, 116], rodD: [86, 117], pieI: [108, 117], pieD: [108, 118], manI: [50, 120], manD: [52, 121] },
};
const m = (base, cambios) => ({ ...POSES[base], ...cambios });
const EJ = {
  tijera: { n: 'SALTOS DE TIJERA', t: 's', met: 8, cam: 1, g: 'cardio', como: 'Saltá abriendo piernas y brazos por arriba de la cabeza, y volvé a cerrar.',
    A: POSES.pie, B: m('pie', { manI: [32, 8], manD: [88, 8], rodI: [47, 100], rodD: [73, 100], pieI: [38, 122], pieD: [82, 122] }) },
  rodillas: { n: 'RODILLAS ARRIBA', t: 's', met: 8, cam: 1, g: 'cardio', como: 'Corré en el lugar subiendo las rodillas hasta la altura de la cadera.',
    A: m('pie', { rodI: [50, 72], pieI: [50, 96], manI: [44, 58], manD: [78, 66] }), B: m('pie', { rodD: [70, 72], pieD: [70, 96], manI: [42, 66], manD: [76, 58] }) },
  talones: { n: 'TALONES A LA COLA', t: 's', met: 7, g: 'cardio', como: 'Trotá en el lugar llevando los talones hacia la cola.',
    A: m('lado', { pieI: [44, 94], manI: [70, 62], manD: [48, 66] }), B: m('lado', { pieD: [44, 94], pieI: [60, 122], manI: [48, 66], manD: [70, 62] }) },

function figura(P, prop) {
  const L = (a, b, c, wd) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${wd}" stroke-linecap="round"/>`;
  const piel = '#f2c9a0', remera = '#ff4d6d', short = '#4f8fff', t = '#2a2238';
  const miembro = (a, b, c) => L(a, b, t, 14) + L(a, b, c, 8);
  const codo = (h, mm) => { const dx = mm[0] - h[0], dy = mm[1] - h[1], l = Math.hypot(dx, dy) || 1, k = Math.max(0, 26 - l) * .45; return [(h[0] + mm[0]) / 2 + (-dy / l) * k, (h[1] + mm[1]) / 2 + (dx / l) * k]; };
  let s = '<svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">';
  s += '<line x1="2" y1="126" x2="118" y2="126" stroke="rgba(42,34,56,.18)" stroke-width="4" stroke-linecap="round"/>';
  if (prop === 'pared') s += '<rect x="14" y="10" width="10" height="116" fill="#e3d7c3" stroke="#2a2238" stroke-width="3"/>';
  if (prop === 'silla') s += '<path d="M8 86 h28 v40 M12 86 v40 M8 86 v-34" fill="none" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>';
  const cD = codo(P.hom, P.manD), cI = codo(P.hom, P.manI);
  s += miembro(P.cad, P.rodD, short) + miembro(P.rodD, P.pieD, piel);
  s += miembro(P.hom, cD, remera) + miembro(cD, P.manD, piel);
  s += L(P.hom, P.cad, t, 25) + L(P.hom, P.cad, remera, 18);
  s += miembro(P.cad, P.rodI, short) + miembro(P.rodI, P.pieI, piel);
  s += miembro(P.hom, cI, remera) + miembro(cI, P.manI, piel);
  for (const p of [P.pieI, P.pieD]) s += `<ellipse cx="${p[0]}" cy="${p[1] + 1}" rx="7" ry="4" fill="#fff" stroke="${t}" stroke-width="2.5"/>`;
  s += `<circle cx="${P.cab[0]}" cy="${P.cab[1]}" r="11.5" fill="${piel}" stroke="${t}" stroke-width="3.2"/>`;
  s += `<rect x="${P.cab[0] - 11.5}" y="${P.cab[1] - 6}" width="23" height="5" rx="2" fill="#ffd23f" stroke="${t}" stroke-width="2"/>`;
  return s + '</svg>';
}

function armarDia(tipo, nivel, semana) {   // la lista de ejercicios de un día, con reps o segundos según nivel y semana
  const N = NIV[nivel], prog = 1 + .1 * (semana - 1), lista = [];
  const base = TIPOS[tipo].l.map(id => N.cambia[id] || id);
  const estir = base.filter(id => EJ[id].g === 'estirar'), resto = base.filter(id => EJ[id].g !== 'estirar');
  for (let v = 0; v < N.vueltas; v++) for (const id of resto) lista.push(id);
  for (const id of estir) lista.push(id);
  return lista.map((id, i) => {
    const e = EJ[id], calor = i < 2 && e.g !== 'estirar' && N.vueltas >= 1 && (e.g === 'calor' || e.g === 'cardio') && tipo !== 'cardio';
    const est = e.g === 'estirar';
    return { id, reps: e.t === 'r' ? Math.round(N.reps * prog * (id === 'burpee' ? .6 : id === 'sentadillaSalto' ? .7 : 1)) : 0,
      seg: e.t === 's' ? Math.round((est ? 30 : calor ? 30 : N.seg * prog) / 5) * 5 : 0 };
  });
}
const segDe = x => x.seg || Math.round(x.reps * (EJ[x.id].g === 'cardio' ? 2.2 : 3));   // duración estimada de cada ejercicio

// ───────── CALORÍAS: MET corregido con tu metabolismo basal (Mifflin-St Jeor) ─────────
function bmr(p) { return Math.max(1000, 10 * p.peso + 6.25 * p.altura - 5 * p.edad + (p.sexo === 'M' ? -161 : 5)); }
const kcalPorMin = (met, p) => met * bmr(p) / 1440;
function kcalDia(lista, p, desc) { let k = 0; for (const x of lista) k += kcalPorMin(EJ[x.id].met, p) * segDe(x) / 60 + kcalPorMin(1.5, p) * desc / 60; return k; }

  } else g = `<text x="165" y="70" text-anchor="middle" font-weight="800" font-size="14" fill="#2a2238" opacity=".5">${P_('sinPeso')}</text>`;
  $('gPeso').innerHTML = g;
  const imc = perfil.peso / Math.pow(perfil.altura / 100, 2), cat = P_('imcCat')[imc < 18.5 ? 0 : imc < 25 ? 1 : imc < 30 ? 2 : 3];
  $('iImc').innerHTML = `${P_('imc')}: ${imc.toFixed(1).replace('.', ',')} <span style="opacity:.6">(${cat})</span>`;
  // calendario del mes
  const hoyD = new Date(), pri = new Date(hoyD.getFullYear(), hoyD.getMonth(), 1), nd = new Date(hoyD.getFullYear(), hoyD.getMonth() + 1, 0).getDate(), fechas = new Set(h.map(x => x.fecha));
  let c = DSEM.map(d => `<span class="cab">${d}</span>`).join('') + '<span></span>'.repeat((pri.getDay() + 6) % 7);
  for (let d = 1; d <= nd; d++) { const f = hoyStr(new Date(hoyD.getFullYear(), hoyD.getMonth(), d)); c += `<span class="${fechas.has(f) ? 'si' : ''}${f === hoy ? ' hoy' : ''}">${d}</span>`; }
  $('iCal').innerHTML = c;
  // progreso
  const pr = leer('rcPrueba', []), lin = [];
  if (pr.length) lin.push(P_('pruebaProg', { a: pr[0].reps + (pr.length > 1 ? ' → ' + pr[pr.length - 1].reps : '') }) + `${pr.length > 1 && pr[0].reps ? ` (${pr[pr.length - 1].reps >= pr[0].reps ? '+' : ''}${Math.round((pr[pr.length - 1].reps / pr[0].reps - 1) * 100)}%)` : ''}`);
  const tot = {}; for (const x of h) for (const e of x.ej || []) if (e.reps) tot[e.id] = (tot[e.id] || 0) + e.reps;
  Object.entries(tot).sort((a, b) => b[1] - a[1]).slice(0, 4).forEach(([id, n]) => lin.push(`${EJ[id] ? RC.T.ej[id][0] : id}: <b>${n}</b> ${P_('enTotal')}`));
  const juegos = h.filter(x => x.tipo === 'juego'); if (juegos.length) lin.push(P_('juegosProg', { n: juegos.length }));
  const pesos2 = leer('rcPeso', []); if (pesos2.length > 1) { const d = pesos2[pesos2.length - 1].kg - pesos2[0].kg; lin.push(P_('pesoProg', { n: (d > 0 ? '+' : '') + d.toFixed(1).replace('.', RC.lang === 'en' ? '.' : ',') })); }
  $('iProg').innerHTML = lin.length ? lin.join('<br>') : P_('sinDatos');
  $('tSes').textContent = h.length; $('tMin').textContent = Math.round(h.reduce((a, x) => a + x.seg, 0) / 60); $('tKcal').textContent = Math.round(h.reduce((a, x) => a + x.kcal, 0)).toLocaleString(RC.lang);
}
let pesoTmp = 70;
$('btnPeso').addEventListener('click', () => { const p = leer('rcPeso', []); pesoTmp = p.length ? p[p.length - 1].kg : perfil.peso; $('pesoNum').querySelector('b').textContent = String(pesoTmp).replace('.', ','); $('mPeso').hidden = false; });
$('pesoNum').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; pesoTmp = Math.round((pesoTmp + (b.textContent === '+' ? .1 : -.1)) * 10) / 10; $('pesoNum').querySelector('b').textContent = String(pesoTmp).replace('.', ','); });
$('btnPesoOk').addEventListener('click', () => { const p = leer('rcPeso', []).filter(x => x.fecha !== hoyStr()); p.push({ fecha: hoyStr(), kg: pesoTmp }); guardar('rcPeso', p); perfil.peso = pesoTmp; guardar('rcPerfil', perfil); $('mPeso').hidden = true; pintarInforme(); });
$('btnPesoNo').addEventListener('click', () => $('mPeso').hidden = true);

// ───────── AJUSTES ─────────
function pintarAjustes() {
  const o = OBJ.find(x => x.id === perfil.objetivo);
  $('ajResumen').innerHTML = `${perfil.edad} ${P_('anios')} · ${String(perfil.peso).replace('.', ',')} kg · ${perfil.altura} cm · ${P_(perfil.sexo === 'M' ? 'm' : 'h')}<br>${P_('objetivoL')}: <b>${o.n}</b><br>${P_('nivelL')}: <b>${NIV[perfil.nivel].n}</b> · ${perfil.dias} ${P_('diasL')}<br>${P_('bmr')}: <b>${Math.round(bmr(perfil))} kcal</b>`;
  marcarSegm('voz', ajustes().voz); marcarSegm('desc', ajustes().desc);
}
$('voz').addEventListener('click', e => { const d = e.target.closest('div[data-v]'); if (!d) return; guardar('rcAjustes', { ...ajustes(), voz: +d.dataset.v }); marcarSegm('voz', d.dataset.v); });
$('desc').addEventListener('click', e => { const d = e.target.closest('div[data-v]'); if (!d) return; guardar('rcAjustes', { ...ajustes(), desc: +d.dataset.v }); marcarSegm('desc', d.dataset.v); });
$('btnEditarPerfil').addEventListener('click', abrirPerfil);
$('btnEntrenador').addEventListener('click', () => RC.elegir(() => location.reload()));
$('btnBorrar').addEventListener('click', () => { if (!confirm(P_('borrarQ'))) return; for (const k of ['rcPerfil', 'rcProgreso', 'rcHistorial', 'rcPeso', 'rcPrueba', 'rcSensacion', 'rcAjustes']) localStorage.removeItem(k); location.reload(); });

// ───────── ARRANQUE ─────────
if (!RC.elegido) RC.elegir(() => location.reload());
const bor = leer('rcBorrador', null);
if (!perfil || bor) { abrirPerfil(); if (bor) { borr = { ...borr, ...bor }; const pr = leer('rcPrueba', []).slice(-1)[0]; if (pr) borr.nivel = nivelDePrueba(pr.reps); for (const nm of document.querySelectorAll('#pPerfil .num')) nm.pinta(); marcarSegm('sexo', borr.sexo); marcarSegm('diasSem', borr.dias); marcarSegm('nivel', borr.nivel); for (const x of $('objetivos').children) x.classList.toggle('sel', x.dataset.v === borr.objetivo); } }
else if (location.hash === '#informe') ir('pInforme');
else ir('pPlan');
window.__e = { EJ, armarDia, sesiones, figura, mezcla, perfil: () => perfil, J };
</script>
</body>

// ───── sonidos: efectos de Kenney (CC0) y algunos hechos con código ─────
let ac = null;
const BUF = {};
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      for (const n of ["toque", "ingrediente", "horno", "listo", "mal", "tacho", "llega", "gana", "monedas", "compra"]) {
        fetch("snd/" + n + ".mp3").then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b, d => { BUF[n] = d; })).catch(() => {});
      }
    } catch (e) {}
  }
  if (ac && ac.state === "suspended") ac.resume();
  musicaSeguir();
  return ac;
}
function muestra(n, vol = 0.6, vel = 1) {
  if (!prog.sonido || !ac || !BUF[n]) return false;
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = BUF[n]; s.playbackRate.value = vel; g.gain.value = vol;
  s.connect(g); g.connect(ac.destination); s.start();
  return true;
}
function tono(f, dur, tipo = "sine", vol = 0.18, cuando = 0, f2 = null) {
  if (!prog.sonido || !ac) return;
  const t = ac.currentTime + cuando;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
}
const SFX = {
  toque: () => muestra("toque", 0.7) || tono(660, 0.08, "triangle", 0.12),
  ingrediente: () => muestra("ingrediente", 0.7, 0.9 + Math.random() * 0.25) || tono(520, 0.07, "triangle", 0.13),

// ───── música (hecha con Gemini): una para el menú y otra para jugar, en loop ─────
const MUSICA = { menu: new Audio("snd/musica-menu.mp3"), juego: new Audio("snd/musica-juego.mp3") };
for (const m of Object.values(MUSICA)) { m.loop = true; m.volume = 0.45; m.preload = "auto"; }
let musicaQuiere = "menu";
function musicaSeguir() {
  for (const [k, m] of Object.entries(MUSICA)) {
    const debe = prog.musica && k === musicaQuiere && !document.hidden;
    if (debe && m.paused) m.play().catch(() => {});
    if (!debe && !m.paused) m.pause();

}

const PRECIO_BASE = 10, PRECIO_TOP = 4;
const RECETAS = {
  muzza:     { top: [], n: { en: "Cheese", es: "Muzzarella", pt: "Muçarela" } },
  aceitunas: { top: ["aceitunas"], n: { en: "Olives", es: "Con aceitunas", pt: "Com azeitonas" } },

  caprese:   { top: ["tomate", "albahaca", "aceitunas"], n: { en: "Caprese", es: "Caprese", pt: "Caprese" } },
  super:     { top: ["jamon", "morron", "aceitunas", "oregano"], n: { en: "Super", es: "Súper", pt: "Super" } },

};

// en qué nivel aparece cada pizza nueva (nivel 1 = 0)
const NUEVA_EN = { muzza: 0, aceitunas: 1, jamon: 2, margarita: 3, jym: 5, napo: 7, especial: 9,
  morron: 12, jya: 15, caprese: 18, super: 22, huerta: 26 };
const TOPPINGS = ["tomate", "aceitunas", "jamon", "morron", "albahaca", "oregano"];
const CRITICO_DESDE = 6;   // nivel 7

// ───── niveles: 40 en 4 zonas; cada 5 hay hora pico ─────
const NIVELES = [];
for (let i = 0; i < 40; i++) {
  const pico = (i + 1) % 5 === 0;
  const recetas = Object.keys(NUEVA_EN).filter(k => NUEVA_EN[k] <= i);
  const nueva = Object.keys(NUEVA_EN).find(k => NUEVA_EN[k] === i) || null;
  const cada = Math.max(3.4, 9 - i * 0.16) * (pico ? 0.7 : 1);
  const tiempo = Math.min(120, 90 + i * 1.5);
  const paciencia = Math.max(15, 34 - i * 0.5);
  const promedio = recetas.reduce((a, r) => a + PRECIO_BASE + PRECIO_TOP * RECETAS[r].top.length, 0) / recetas.length;
  const clientes = tiempo / Math.max(cada, 6);   // una persona no arma más de una pizza cada ~6 s
  const meta = Math.round(clientes * promedio * Math.min(0.8, 0.42 + i * 0.01) / 5) * 5;
  NIVELES.push({ recetas, nueva, pico, cada, tiempo: Math.round(tiempo), paciencia, meta, critico: i === CRITICO_DESDE });
}

function nuevoCliente(i) {
  const N = J.N;
  // el crítico: desde el nivel 7, de vez en cuando (y nunca dos a la vez)
  const hayCritico = J.clientes.some(c => c && c.quien === "critico");
  const critico = nivel >= CRITICO_DESDE && !hayCritico && J.criticos < 2 && Math.random() < (nivel === CRITICO_DESDE ? 0.3 : 0.12);
  let quien;
  if (critico) { quien = "critico"; J.criticos++; }
  else {
    const ocupados = J.clientes.filter(Boolean).map(c => c.quien);
    const libres = PERSONAS.filter(p => !ocupados.includes(p));
    quien = libres[Math.floor(Math.random() * libres.length)] || PERSONAS[0];
  }
  const rs = N.recetas;
  const ultima = rs.reduce((a, r) => NUEVA_EN[r] > NUEVA_EN[a] ? r : a, rs[0]);
  const reciente = nivel - NUEVA_EN[ultima] <= 2;
  const receta = reciente && Math.random() < 0.35 ? ultima : rs[Math.floor(Math.random() * rs.length)];
  const pac = N.paciencia * J.E.paciencia * (critico ? 0.6 : 1);
  J.clientes[i] = { quien, receta, pac, pacMax: pac, estado: "entra", x: i % 2 ? W + 150 : -150, dest: SLOTS[i], t: 0, critico };
  SFX.llega();
  J.uma = "uma-piensa"; J.umaT = 1.2;
}

// ───── armar pizzas ─────
function tocarIngrediente(k) {
  const p = J.pizza;
  if (k === "masa") {
    if (p) { aviso(T("yaMasa"), TABLA.x, TABLA.y - 120); return; }
    J.pizza = { salsa: false, queso: false, top: [], pos: [] };
  } else {
    if (!p) { aviso(T("primeroMasa"), TABLA.x, TABLA.y - 120); SFX.mal(); return; }
    if (k === "salsa") p.salsa = true;
    else if (k === "queso") p.queso = true;
    else if (!p.top.includes(k)) {
      p.top.push(k);
      const n = k === "oregano" ? 14 : 6;
      for (let j = 0; j < n; j++) {
        const a = Math.random() * Math.PI * 2, r = 18 + Math.random() * 52;
        p.pos.push({ k, x: Math.cos(a) * r, y: Math.sin(a) * r, rot: Math.random() * 6.28 });
      }
    }
  }
  J.uma = "uma-cocina"; J.umaT = 0.7;
  SFX.ingrediente();
  J.efectos.push({ tipo: "pop", x: TABLA.x, y: TABLA.y, t: 0 });
}

function alHorno() {
  const p = J.pizza;
  if (!p) return;
  if (!p.salsa || !p.queso) { aviso(T("faltaSalsa"), TABLA.x, TABLA.y - 120); SFX.mal(); return; }
  const i = J.horno.indexOf(null);
  if (i < 0) { aviso(T("hornoLleno"), HORNO.x, HORNO.y - 170); SFX.mal(); return; }
  J.horno[i] = Object.assign(p, { coc: 0 });
  J.pizza = null;
  SFX.horno();
}

function cocida(p) { return p.coc != null && p.coc >= J.E.cocida; }
function quemada(p) { return p.coc != null && p.coc >= J.E.cocida + J.E.quemada; }

function sacarDelHorno(i) {
  const p = J.horno[i];
  if (!p) return;
  if (!cocida(p)) { aviso(T("cruda"), HORNO.x, HORNO.y - 170); return; }
  J.horno[i] = null;
  if (quemada(p)) { aviso(T("quemada"), HORNO.x, HORNO.y - 170); SFX.tacho(); return; }
  if (!entregar(p)) {
    const b = J.bandeja.indexOf(null);
    if (b >= 0) J.bandeja[b] = p;
    else { aviso(T("sinLugar"), HORNO.x, HORNO.y - 170); J.horno[i] = p; }
  }
}

function coincide(p, receta) {
  const r = RECETAS[receta].top;
  return p.top.length === r.length && r.every(x => p.top.includes(x));
}

// entrega la pizza al cliente que la pidió (el más apurado)
function entregar(p) {
  let mejor = -1;
  J.clientes.forEach((c, i) => {
    if (c && c.estado === "espera" && coincide(p, c.receta) && (mejor < 0 || c.pac / c.pacMax < J.clientes[mejor].pac / J.clientes[mejor].pacMax)) mejor = i;
  });
  if (mejor < 0) return false;
  const c = J.clientes[mejor];
  let precio = (PRECIO_BASE + PRECIO_TOP * RECETAS[c.receta].top.length) * J.E.precio;
  if (c.critico) precio *= 3;
  const propina = precio * 0.5 * (c.pac / c.pacMax) * J.E.propina;
  const total = Math.round(precio + propina);
  J.monedas += total;
  J.atendidos++;
  c.estado = "feliz"; c.t = 0;
  J.efectos.push({ tipo: "plata", txt: "+" + total, x: SLOTS[mejor], y: 230, t: 0 });
  if (c.critico) { J.efectos.push({ tipo: "texto", txt: T("critica"), x: SLOTS[mejor], y: 175, t: 0, col: "#ffd34a" }); SFX.critico(); }
  else if (propina >= 4) J.efectos.push({ tipo: "texto", txt: T("propina"), x: SLOTS[mejor], y: 180, t: 0 });
  J.efectos.push({ tipo: "entrega", p, x: SLOTS[mejor], y: 360, t: 0 });
  J.uma = "uma-saluda"; J.umaT = 1;
  SFX.caja();
  return true;
}

function tocarBandeja(i) {
  const p = J.bandeja[i];
  if (!p) return;
  if (entregar(p)) J.bandeja[i] = null;
  else { aviso(T("nadie"), BANDEJA[i].x, BANDEJA[i].y - 70); SFX.mal(); }
}

function tirar() { if (J.pizza) { J.pizza = null; SFX.tacho(); } }
function aviso(txt, x, y) { J.efectos.push({ tipo: "aviso", txt, x, y, t: 0 }); }

// ───── actualización ─────
function actualizar(dt) {
  t += dt;
  if (pantalla !== "juego" || J.pausa || J.terminado) return;
  J.tiempo -= dt;
  if (J.umaT > 0) { J.umaT -= dt; if (J.umaT <= 0) J.uma = "uma-saluda"; }
  J.prox -= dt;
  if (J.prox <= 0 && J.tiempo > 6) {
    const libres = [0, 1, 2].filter(i => !J.clientes[i]);
    if (libres.length) nuevoCliente(libres[Math.floor(Math.random() * libres.length)]);
    J.prox = J.N.cada * J.E.clientes * (0.8 + Math.random() * 0.4);
  }
  J.clientes.forEach((c, i) => {
    if (!c) return;
    c.t += dt;
    if (c.estado === "entra") {
      c.x += (c.dest - c.x) * Math.min(1, dt * 4.5);
      if (Math.abs(c.x - c.dest) < 3) { c.x = c.dest; c.estado = "espera"; }
    } else if (c.estado === "espera") {
      c.pac -= dt;
      if (c.pac <= 0) { c.estado = "enojado"; c.t = 0; J.perdidos++; SFX.enojado(); J.efectos.push({ tipo: "texto", txt: T("meVoy"), x: c.x, y: 200, t: 0 }); }
    } else if (c.t > 0.9) {
      const sale = i % 2 ? W + 200 : -200;
      c.x += (sale - c.x) * Math.min(1, dt * 3);
      if (Math.abs(c.x - sale) < 40) J.clientes[i] = null;
    }
  });
  J.horno.forEach(p => {
    if (!p) return;
    const lista0 = cocida(p), quem0 = quemada(p);
    p.coc += dt;
    if (!lista0 && cocida(p)) SFX.listo();
    if (!quem0 && quemada(p)) SFX.quemado();
  });
  J.efectos = J.efectos.filter(e => (e.t += dt) < (e.tipo === "aviso" ? 1.4 : e.tipo === "texto" ? 1.4 : 1.1));
  if (J.tiempo <= 0) {
    J.tiempo = 0; J.terminado = true;
    const N = J.N;
    const est = J.monedas >= N.meta * 1.8 ? 3 : J.monedas >= N.meta * 1.4 ? 2 : J.monedas >= N.meta ? 1 : 0;
    J.estrellas = est;
    // las monedas siempre van a la tienda (aunque no pases el nivel)
    prog.monedas += J.monedas;
    if (est > 0) { prog.estrellas[nivel] = Math.max(prog.estrellas[nivel] || 0, est); SFX.gana(); }
    else SFX.pierde();
    guardar();
    setTimeout(() => { pantalla = "fin"; musica("menu"); }, 600);
  }
}

// ───── dibujo ─────
function img(n, x, y, w, h, alfa = 1) {
  const im = IMG[n];
  if (!im || !im.complete || !im.naturalWidth) return;
  if (h == null) h = w * im.naturalHeight / im.naturalWidth;
  cx.globalAlpha = alfa;
  cx.drawImage(im, x - w / 2, y - h / 2, w, h);
  cx.globalAlpha = 1;
}
function imgAlto(n, x, y, alto) {
  const im = IMG[n];
  if (!im || !im.naturalWidth) return;
  const w = alto * im.naturalWidth / im.naturalHeight;
  cx.drawImage(im, x - w / 2, y - alto / 2, w, alto);
}
// entra en una caja de ancho x alto sin deformarse
function imgCaja(n, x, y, cw, ch) {
  const im = IMG[n];
  if (!im || !im.naturalWidth) return;
  const k = Math.min(cw / im.naturalWidth, ch / im.naturalHeight);
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  cx.drawImage(im, x - w / 2, y - h / 2, w, h);
}
function imgPie(n, x, pie, alto) {
  const im = IMG[n];
  if (!im || !im.naturalWidth) return;
  const w = alto * im.naturalWidth / im.naturalHeight;
  cx.drawImage(im, x - w / 2, pie - alto, w, alto);
}
function redondo(x, y, w, h, r) { cx.beginPath(); cx.roundRect(x, y, w, h, r); }
function texto(s, x, y, tam, col = "#fff", borde = "#5a2d12", alin = "center", peso = 700) {
  cx.font = `${peso} ${tam}px Fredoka, system-ui, sans-serif`;
  cx.textAlign = alin; cx.textBaseline = "middle";
  if (borde) { cx.lineJoin = "round"; cx.lineWidth = Math.max(4, tam * 0.2); cx.strokeStyle = borde; cx.strokeText(s, x, y); }
  cx.fillStyle = col; cx.fillText(s, x, y);
}
// achica la letra hasta que entre en el ancho
function textoAncho(s, x, y, tam, ancho, col, borde, alin = "center", peso = 700) {
  cx.font = `${peso} ${tam}px Fredoka, system-ui, sans-serif`;
  while (tam > 12 && cx.measureText(s).width > ancho) { tam -= 1; cx.font = `${peso} ${tam}px Fredoka, system-ui, sans-serif`; }
  texto(s, x, y, tam, col, borde, alin, peso);
}
function boton(s, x, y, w, h, al, col = "#2f86ff", tam = 34) {
  const apretado = presion && presion.x > x - w / 2 && presion.x < x + w / 2 && presion.y > y - h / 2 && presion.y < y + h / 2;
  const dy = apretado ? 4 : 0;
  redondo(x - w / 2, y - h / 2 + 6, w, h, h / 2); cx.fillStyle = "rgba(0,0,0,.25)"; cx.fill();
  redondo(x - w / 2, y - h / 2 + dy, w, h, h / 2); cx.fillStyle = col; cx.fill();
  cx.lineWidth = 5; cx.strokeStyle = "#fff"; cx.stroke();
  textoAncho(s, x, y + dy, tam, w - 30, "#fff", "rgba(0,0,0,.25)");
  toques.push({ x: x - w / 2, y: y - h / 2, w, h, al: () => { SFX.toque(); al(); } });
}
function zona(x, y, w, h, al) { toques.push({ x, y, w, h, al }); }
function monedaTxt(n, x, y, tam = 34, alin = "left") {
  img("moneda", x, y, tam * 1.15);
  texto(String(n), x + tam * 0.8, y + 1, tam, "#fff", "#7a4a00", "left");
}
function zonaDe(n) { return Math.min(3, Math.floor(n / 10)); }
function fondoDe(n) { const z = zonaDe(n); return z === 0 ? "fondo" : "fondo-" + (z + 1); }
function mostradorDe(n) { const z = zonaDe(n); return z === 0 ? "mostrador" : "mostrador-" + (z + 1); }

function dibujarPizza(p, x, y, r) {
  const coc = p.coc != null && J && p.coc >= (J.E ? J.E.cocida : 5);
  const quem = p.coc != null && J && J.E && p.coc >= J.E.cocida + J.E.quemada;
  const cocMuestra = p.muestra;
  const base = quem ? "p-quemada" : (coc || cocMuestra) ? "p-cocida" : p.queso ? "p-queso" : p.salsa ? "p-salsa" : "i-masa";
  img(base, x, y, r * 2.15, base === "i-masa" ? r * 1.9 : r * 2.15);
  for (const q of p.pos) {
    const s = r / 92;
    cx.save(); cx.translate(x + q.x * s, y + q.y * s); cx.rotate(q.rot);
    if (quem) cx.filter = "brightness(.45)";
    else if (coc || cocMuestra) cx.filter = "brightness(.92) saturate(1.15)";
    if (q.k === "oregano") { cx.fillStyle = "#5c6b2a"; cx.fillRect(-2 * s, -2 * s, 4 * s, 4 * s); }
    else {
      const tam = { tomate: 26, aceitunas: 22, jamon: 30, morron: 30, albahaca: 26 }[q.k] * s;
      img("i-" + q.k, 0, 0, tam * 1.6);
    }
    cx.filter = "none";
    cx.restore();
  }
}

const MUESTRAS = {};
function pizzaDe(receta) {
  if (MUESTRAS[receta]) return MUESTRAS[receta];
  let semilla = receta.length * 97 + receta.charCodeAt(0) * 13;
  const rnd = () => { semilla = (semilla * 9301 + 49297) % 233280; return semilla / 233280; };
  const p = { salsa: true, queso: true, top: RECETAS[receta].top.slice(), pos: [], muestra: true };
  for (const k of p.top) {
    const n = k === "oregano" ? 14 : 6;
    for (let j = 0; j < n; j++) { const a = rnd() * 6.28, r = 18 + rnd() * 52; p.pos.push({ k, x: Math.cos(a) * r, y: Math.sin(a) * r, rot: rnd() * 6.28 }); }
  }
  return (MUESTRAS[receta] = p);
}

function dibujarPedido(c) {
  const R = RECETAS[c.receta];

  const paso = n > 3 ? 38 : 48;

  cx.lineWidth = c.critico ? 6 : 4; cx.strokeStyle = c.critico ? "#e0a400" : "#c9a07a"; cx.stroke();
  cx.beginPath(); cx.moveTo(x - 14, y + h / 2 - 2); cx.lineTo(x, y + h / 2 + 18); cx.lineTo(x + 14, y + h / 2 - 2); cx.fillStyle = c.critico ? "#fff3c4" : "#fff"; cx.fill();
  img("p-queso", x - w / 2 + 48, y - 8, 70);
  R.top.forEach((tp, i) => img("i-" + tp, x - w / 2 + 108 + i * paso, y - 8, paso - 2));
  textoAncho(nombreReceta(c.receta), x, y + 36, 19, w - 20, "#7a3b16", null);
  if (c.critico) texto("★ x3", x + w / 2 - 6, y - h / 2 + 4, 22, "#ffd34a", "#7a4a00");
  const f = Math.max(0, c.pac / c.pacMax);
  redondo(x - w / 2 + 14, y + h / 2 + 22, w - 28, 12, 6); cx.fillStyle = "rgba(0,0,0,.25)"; cx.fill();

}

  textoAncho(T("nivel", nivel + 1), W - 210, 47, 28, 160, "#fff", "#7a3b16");
  cx.beginPath(); cx.arc(W - 56, 47, 32, 0, 6.3); cx.fillStyle = "rgba(255,255,255,.92)"; cx.fill();
  cx.fillStyle = "#7a3b16"; cx.fillRect(W - 66, 33, 7, 28); cx.fillRect(W - 53, 33, 7, 28);
  zona(W - 90, 14, 70, 70, () => { J.pausa = true; });
  for (const e of J.efectos) {
    const k = e.t;
    if (e.tipo === "plata") texto(e.txt, e.x, e.y - k * 70, 40, "#ffd34a", "#7a4a00");
    else if (e.tipo === "texto") textoAncho(e.txt, e.x, e.y - k * 30, 30, 300, e.col || "#fff", e.col ? "#7a4a00" : "#c0392b");
    else if (e.tipo === "aviso") { cx.globalAlpha = Math.min(1, (1.4 - k) * 3); texto(e.txt, e.x, e.y - k * 20, 26, "#fff", "#c0392b"); cx.globalAlpha = 1; }
    else if (e.tipo === "pop") { cx.globalAlpha = 1 - k / 1.1; cx.lineWidth = 6; cx.strokeStyle = "#fff"; cx.beginPath(); cx.arc(e.x, e.y, TABLA.r + k * 60, 0, 6.3); cx.stroke(); cx.globalAlpha = 1; }
    else if (e.tipo === "entrega") { cx.globalAlpha = 1 - k / 1.1; dibujarPizza(e.p, e.x, e.y - k * 40, 40); cx.globalAlpha = 1; }
  }
  if (J.pausa) dibujarPausa();
}

function botonIngrediente(k, x, y, tam = 112) {
  const apretado = presion && Math.hypot(presion.x - x, presion.y - y) < tam / 2;
  cx.beginPath(); cx.arc(x, y + 5, tam / 2, 0, 6.3); cx.fillStyle = "rgba(60,30,10,.3)"; cx.fill();
  cx.beginPath(); cx.arc(x, y + (apretado ? 4 : 0), tam / 2, 0, 6.3); cx.fillStyle = "#fff6e8"; cx.fill();
  cx.lineWidth = 5; cx.strokeStyle = "#c9a07a"; cx.stroke();
  img("i-" + k, x, y + (apretado ? 4 : 0), tam * (k === "oregano" ? 0.5 : 0.82));
  zona(x - tam / 2, y - tam / 2, tam, tam, () => tocarIngrediente(k));
}

function velo(a = 0.55) { cx.fillStyle = `rgba(20,40,90,${a})`; cx.fillRect(0, 0, W, H); }
function cartel(w, h, y = H / 2) {
  redondo(W / 2 - w / 2, y - h / 2, w, h, 36); cx.fillStyle = "#fff6e8"; cx.fill();
  cx.lineWidth = 8; cx.strokeStyle = "#e8a54a"; cx.stroke();
}

// interruptores de música, sonido e idioma (en la pausa y en el título)
function opciones(x, y) {
  boton(T("musica") + ": " + (prog.musica ? T("si") : T("no")), x, y, 320, 66, () => { prog.musica = !prog.musica; guardar(); musicaSeguir(); }, "#2f86ff", 26);
  boton(T("sonido") + ": " + (prog.sonido ? T("si") : T("no")), x, y + 82, 320, 66, () => { prog.sonido = !prog.sonido; guardar(); }, "#2f86ff", 26);
}

function dibujarPausa() {
  toques = [];
  velo();
  cartel(600, 560);
  texto(T("pausa"), W / 2, H / 2 - 210, 54, "#fff", "#e0352b");
  boton(T("seguir"), W / 2, H / 2 - 115, 340, 84, () => { J.pausa = false; }, "#2fbf5a", 36);
  opciones(W / 2, H / 2 - 15);
  boton(T("salir"), W / 2, H / 2 + 175, 340, 70, () => { pantalla = "niveles"; musica("menu"); }, "#e0352b", 28);
}

function dibujarTitulo() {
  img("fondo", W / 2, H / 2, W, H);
  velo(0.25);
  cx.save(); cx.beginPath(); cx.arc(400, 390, 280, 0, 6.3); cx.clip();
  img("portada", 400, 390, 600, 600);
  cx.restore();
  cx.lineWidth = 14; cx.strokeStyle = "#fff"; cx.beginPath(); cx.arc(400, 390, 280, 0, 6.3); cx.stroke();
  const s = 1 + Math.sin(t * 2.5) * 0.025;
  cx.save(); cx.translate(960, 215); cx.scale(s, s);
  imgAlto("logo-" + idioma, 0, 0, 290);
  cx.restore();
  boton(T("jugar"), 960, 455, 340, 96, () => { audio(); pantalla = "niveles"; }, "#2fbf5a", 46);
  boton(T("tienda"), 960, 560, 260, 70, () => { audio(); pantalla = "tienda"; volverDeTienda = "titulo"; }, "#ff9f1c", 30);
  textoAncho(T("lema"), 960, 640, 26, 560, "#fff", "#7a3b16");
  // idioma
  boton(idioma.toUpperCase(), W - 80, 60, 110, 70, () => { pantalla = "idioma"; }, "#2f86ff", 28);
  // música
  boton("♪", W - 210, 60, 90, 70, () => { audio(); prog.musica = !prog.musica; guardar(); musicaSeguir(); }, prog.musica ? "#2f86ff" : "#8a93a6", 34);
}

function dibujarIdioma() {
  img("fondo", W / 2, H / 2, W, H);
  velo(0.6);
  cartel(620, 520);
  texto(T("eligeIdioma"), W / 2, H / 2 - 190, 44, "#fff", "#e0352b");
  [["en", "English"], ["es", "Español"], ["pt", "Português"]].forEach(([c, n], i) => {
    boton(n, W / 2, H / 2 - 80 + i * 110, 380, 90, () => { idioma = c; prog.idioma = c; guardar(); aplicarIdioma(); pantalla = "titulo"; }, c === idioma ? "#2fbf5a" : "#2f86ff", 38);
  });
}

function dibujarNiveles() {
  img(fondoDe(pagina * 10), W / 2, H / 2, W, H);
  velo(0.5);
  texto(T("zonas")[pagina], W / 2, 70, 56, "#fff", "#e0352b");
  textoAncho(T("nivelesDel", pagina * 10 + 1, pagina * 10 + 10), W / 2, 126, 28, 500, "#fff", "#1a4a9a");
  const total = Object.values(prog.estrellas).reduce((a, b) => a + b, 0);
  texto("★ " + total, W - 120, 70, 40, "#ffd34a", "#7a4a00");
  boton("‹", 80, 70, 90, 80, () => { pantalla = "titulo"; }, "#2f86ff", 50);
  for (let k = 0; k < 10; k++) {
    const i = pagina * 10 + k;
    const x = 330 + (k % 5) * 180, y = 280 + Math.floor(k / 5) * 210;
    const abierto = i === 0 || (prog.estrellas[i - 1] || 0) > 0;
    const est = prog.estrellas[i] || 0;
    const N = NIVELES[i];
    cx.beginPath(); cx.arc(x, y + 6, 68, 0, 6.3); cx.fillStyle = "rgba(0,0,0,.25)"; cx.fill();
    cx.beginPath(); cx.arc(x, y, 68, 0, 6.3); cx.fillStyle = abierto ? (N.pico ? "#ffe2b8" : "#fff6e8") : "#9aa7bd"; cx.fill();
    cx.lineWidth = 7; cx.strokeStyle = abierto ? (N.pico ? "#e0352b" : "#e8a54a") : "#6c7891"; cx.stroke();
    if (abierto) {
      texto(String(i + 1), x, y - 6, 52, "#e0352b", null);
      if (N.nueva) dibujarPizza(pizzaDe(N.nueva), x + 50, y - 50, 20);
      for (let q = 0; q < 3; q++) texto("★", x - 38 + q * 38, y + 90, 36, q < est ? "#ffd34a" : "rgba(255,255,255,.35)", q < est ? "#a86a00" : null);
      zona(x - 68, y - 68, 136, 136, () => { audio(); SFX.toque(); intro(i); });
    } else {
      cx.fillStyle = "#5c6880"; redondo(x - 22, y - 6, 44, 34, 6); cx.fill();
      cx.lineWidth = 7; cx.strokeStyle = "#5c6880"; cx.beginPath(); cx.arc(x, y - 8, 15, Math.PI, 0); cx.stroke();
    }
  }
  if (pagina > 0) boton("‹", 110, 380, 90, 110, () => { pagina--; }, "#2f86ff", 60);
  if (pagina < 3) boton("›", W - 110, 380, 90, 110, () => { pagina++; }, "#2f86ff", 60);
  // tienda
  boton(T("tienda"), W / 2, 715, 300, 72, () => { pantalla = "tienda"; volverDeTienda = "niveles"; }, "#ff9f1c", 30);
  redondo(W / 2 + 175, 690, 190, 52, 26); cx.fillStyle = "rgba(0,0,0,.35)"; cx.fill();
  monedaTxt(prog.monedas, W / 2 + 205, 716, 30);
}

let introN = 0;
function intro(i) { introN = i; pagina = Math.floor(i / 10); pantalla = "intro"; }
function dibujarIntro() {
  img(fondoDe(introN), W / 2, H / 2, W, H);
  velo();
  cartel(780, 560);
  const N = NIVELES[introN];
  texto(T("nivel", introN + 1), W / 2, H / 2 - 220, 56, "#fff", "#e0352b");
  textoAncho(T("meta", N.meta, N.tiempo + efectos().tiempoExtra), W / 2, H / 2 - 145, 32, 700, "#7a3b16", null);
  if (N.nueva) {
    texto(introN === 0 ? T("primera") : T("nueva"), W / 2, H / 2 - 80, 28, "#e0352b", null);
    dibujarPizza(pizzaDe(N.nueva), W / 2 - 150, H / 2 + 20, 62);
    textoAncho(nombreReceta(N.nueva), W / 2 + 60, H / 2 - 10, 36, 360, "#7a3b16", null);
    const pasos = ["masa", "salsa", "queso"].concat(RECETAS[N.nueva].top);
    pasos.forEach((k, i) => img("i-" + k, W / 2 + 60 - (pasos.length - 1) * 26 + i * 52, H / 2 + 52, 46));
  } else if (N.critico) {
    imgPie("critico-enojado", W / 2 - 150, H / 2 + 110, 210);
    textoAncho(T("critico"), W / 2 + 70, H / 2 - 30, 30, 430, "#e0352b", null);
    textoAncho(T("criticoTxt"), W / 2 + 70, H / 2 + 20, 24, 430, "#7a3b16", null);
  } else if (N.pico) {
    textoAncho(T("hora"), W / 2, H / 2 - 60, 48, 600, "#fff", "#e0352b");
    textoAncho(T("horaTxt"), W / 2, H / 2 + 5, 30, 640, "#7a3b16", null);
    textoAncho(T("horaTip"), W / 2, H / 2 + 48, 26, 640, "#9a6a46", null);
  } else {
    texto(T("puedenPedir"), W / 2, H / 2 - 70, 28, "#e0352b", null);
    const rs = N.recetas.slice(-5);
    rs.forEach((r, i) => {
      const x = W / 2 + 60 - (rs.length - 1) * 64 + i * 128;
      dibujarPizza(pizzaDe(r), x, H / 2, 37);
      textoAncho(nombreReceta(r), x, H / 2 + 56, 17, 124, "#7a3b16", null, "center", 600);
    });
  }
  imgPie("uma-saluda", W / 2 - 300, H / 2 + 250, 230);
  boton(T("cocinar"), W / 2 + 60, H / 2 + 185, 380, 90, () => nuevaPartida(introN), "#2fbf5a", 40);
  boton("‹", W / 2 - 340, H / 2 - 220, 70, 60, () => { pantalla = "niveles"; }, "#2f86ff", 40);
}

function dibujarFin() {
  dibujarJuego();
  toques = [];
  velo();
  cartel(720, 560);
  const est = J.estrellas;
  texto(est > 0 ? T("superado") : T("casi"), W / 2, H / 2 - 210, 54, "#fff", est > 0 ? "#2fbf5a" : "#e0352b");
  for (let k = 0; k < 3; k++) texto("★", W / 2 - 110 + k * 110, H / 2 - 105, 110, k < est ? "#ffd34a" : "#e3d6c4", k < est ? "#a86a00" : "#c9b8a3");
  textoAncho(T("juntaste", J.monedas, J.N.meta), W / 2, H / 2 - 5, 32, 620, "#7a3b16", null);
  textoAncho(T("atendiste", J.atendidos) + (J.perdidos ? T("seFueron", J.perdidos) : ""), W / 2, H / 2 + 35, 26, 620, "#9a6a46", null);
  img(est === 3 ? "cofre" : "monedas", W / 2 + 280, H / 2 - 120, est === 3 ? 120 : 80);
  textoAncho(T("ganadas", J.monedas), W / 2 + 60, H / 2 + 75, 24, 420, "#d98e10", null);
  imgPie(est > 0 ? "uma-saluda" : "uma-piensa", W / 2 - 270, H / 2 + 270, 200);
  if (est > 0 && nivel < NIVELES.length - 1) boton(T("siguiente"), W / 2 + 60, H / 2 + 150, 320, 84, () => intro(nivel + 1), "#2fbf5a", 36);
  else boton(T("reintentar"), W / 2 + 60, H / 2 + 150, 320, 84, () => intro(nivel), "#2fbf5a", 36);
  boton(T("tienda"), W / 2 - 50, H / 2 + 235, 200, 56, () => { pantalla = "tienda"; volverDeTienda = "niveles"; }, "#ff9f1c", 24);
  boton(T("niveles"), W / 2 + 170, H / 2 + 235, 200, 56, () => { pantalla = "niveles"; }, "#2f86ff", 24);
}

// ───── tienda ─────
let volverDeTienda = "niveles";
let tiendaMsg = null;
function comprar(m) {
  const nv = nivelMejora(m.id);
  if (nv >= m.costos.length) return;
  const costo = m.costos[nv];
  if (prog.monedas < costo) { tiendaMsg = { txt: T("faltan"), t: 0, mal: true }; SFX.mal(); return; }
  prog.monedas -= costo;
  prog.mejoras[m.id] = nv + 1;
  guardar();
  SFX.compra();
  tiendaMsg = { txt: T("comprado"), t: 0 };
}
function dibujarTienda() {
  img("fondo", W / 2, H / 2, W, H);
  velo(0.62);
  texto(T("tiendaTit"), W / 2, 58, 50, "#fff", "#e0352b");
  boton("‹", 80, 58, 90, 76, () => { pantalla = volverDeTienda; }, "#2f86ff", 50);
  redondo(W - 300, 26, 270, 64, 32); cx.fillStyle = "rgba(0,0,0,.35)"; cx.fill();
  monedaTxt(prog.monedas, W - 262, 58, 36);
  MEJORAS.forEach((m, i) => {
    const col = i % 3, fila = Math.floor(i / 3);
    const x = 250 + col * 438, y = 205 + fila * 190;
    const nv = nivelMejora(m.id), max = m.costos.length, lleno = nv >= max;
    redondo(x - 205, y - 82, 410, 170, 26); cx.fillStyle = lleno ? "#e6f7e3" : "#fff6e8"; cx.fill();
    cx.lineWidth = 5; cx.strokeStyle = lleno ? "#4fbf5a" : "#e8a54a"; cx.stroke();
    imgCaja(m.img, x - 135, y - 8, 120, 120);
    textoAncho(m.n[idioma] || m.n.en, x - 60, y - 52, 26, 250, "#7a3b16", null, "left");
    cx.font = "600 18px Fredoka, system-ui, sans-serif";
    // descripción en hasta 2 renglones
    const palabras = (m.d[idioma] || m.d.en).split(" ");
    let l1 = "", l2 = "";
    for (const p of palabras) { if (cx.measureText(l1 + " " + p).width < 250 && !l2) l1 = (l1 + " " + p).trim(); else l2 = (l2 + " " + p).trim(); }
    texto(l1, x - 60, y - 20, 18, "#9a6a46", null, "left", 600);
    if (l2) texto(l2, x - 60, y + 2, 18, "#9a6a46", null, "left", 600);
    for (let k = 0; k < max; k++) { cx.beginPath(); cx.arc(x - 50 + k * 22, y + 30, 8, 0, 6.3); cx.fillStyle = k < nv ? "#4fbf5a" : "#e3d6c4"; cx.fill(); }
    if (lleno) texto(T("maximo"), x + 120, y + 52, 22, "#4fbf5a", null);
    else {
      const costo = m.costos[nv], alcanza = prog.monedas >= costo;
      const bx = x + 110, by = y + 50;
      const apretado = presion && presion.x > bx - 80 && presion.x < bx + 80 && presion.y > by - 26 && presion.y < by + 26;
      redondo(bx - 80, by - 26 + (apretado ? 3 : 0), 160, 52, 26); cx.fillStyle = alcanza ? "#2fbf5a" : "#b9b2a6"; cx.fill();
      cx.lineWidth = 4; cx.strokeStyle = "#fff"; cx.stroke();
      img("moneda", bx - 50, by + (apretado ? 3 : 0), 34);
      texto(String(costo), bx + 12, by + 1 + (apretado ? 3 : 0), 26, "#fff", "rgba(0,0,0,.25)");
      zona(bx - 80, by - 26, 160, 52, () => comprar(m));
    }
  });
  if (tiendaMsg) {
    tiendaMsg.t += 1 / 60;
    if (tiendaMsg.t > 1.4) tiendaMsg = null;
    else texto(tiendaMsg.txt, W / 2, 735 - tiendaMsg.t * 20, 34, "#fff", tiendaMsg.mal ? "#c0392b" : "#1c7a36");
  }
}

function dibujarCarga() {
  cx.fillStyle = "#2b6fd6"; cx.fillRect(0, 0, W, H);
  const f = cargadas / NOMBRES.length;
  if (IMG["logo-" + idioma].complete && IMG["logo-" + idioma].naturalWidth) imgAlto("logo-" + idioma, W / 2, H / 2 - 90, 250);
  redondo(W / 2 - 300, H / 2 + 90, 600, 26, 13); cx.fillStyle = "rgba(255,255,255,.25)"; cx.fill();
  redondo(W / 2 - 300, H / 2 + 90, 600 * f, 26, 13); cx.fillStyle = "#fff"; cx.fill();
  if (cargadas >= NOMBRES.length) pantalla = "titulo";
}

// ───── bucle ─────
let ultimo = performance.now();
function cuadro(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000);
  ultimo = ahora;
  actualizar(dt);
  cx.setTransform(esc * dpr, 0, 0, esc * dpr, 0, 0);
  toques = [];
  if (pantalla === "carga") dibujarCarga();
  else if (pantalla === "titulo") dibujarTitulo();
  else if (pantalla === "idioma") dibujarIdioma();
  else if (pantalla === "niveles") dibujarNiveles();
  else if (pantalla === "intro") dibujarIntro();
  else if (pantalla === "juego") dibujarJuego();
  else if (pantalla === "fin") dibujarFin();
  else if (pantalla === "tienda") dibujarTienda();
  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);

// ───── toques ─────
let presion = null;
function punto(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / esc, y: (e.clientY - r.top) / esc };
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  audio();
  const p = punto(e);
  presion = p;
  for (let i = toques.length - 1; i >= 0; i--) {
    const z = toques[i];
    if (p.x >= z.x && p.x <= z.x + z.w && p.y >= z.y && p.y <= z.y + z.h) { z.al(); break; }
  }
});
window.addEventListener("pointerup", () => { presion = null; });
document.addEventListener("visibilitychange", () => {
  if (document.hidden && J && pantalla === "juego") J.pausa = true;
  musicaSeguir();
});

// para las pruebas automáticas
window.__cu = { get J() { return J; }, get pantalla() { return pantalla; }, set pantalla(v) { pantalla = v; },
  nuevaPartida, tocarIngrediente, alHorno, sacarDelHorno, tocarBandeja, RECETAS, cocida, quemada, prog, comprar, MEJORAS,
  setIdioma(c) { idioma = c; aplicarIdioma(); }, set pagina(v) { pagina = v; } };
</script>
</body>
</html>

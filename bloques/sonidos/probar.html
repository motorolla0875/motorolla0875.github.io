<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonidos de Bloques</title>
<style>body{margin:0;padding:16px;background:#2b2b2b;color:#fff;font:15px system-ui,sans-serif}h1{font-size:20px}h2{font-size:15px;margin:18px 0 6px;color:#ffe066}
button{margin:3px;padding:10px 12px;border:2px solid #000;background:#5f8f3a;color:#fff;font-size:14px;border-radius:4px}button.on{background:#c0392b}</style></head><body>
<h1>Sonidos de Bloques</h1><p>Toca cada uno para escucharlo. Anota el nombre de los que no te gusten.</p><div id="l"></div>
<script>const G={"agarrar": ["agarrar"], "arena": ["arena1", "arena2"], "comer": ["comer"], "fabricar": ["fabricar"], "final": ["final"], "golpe": ["golpe1", "golpe_b1"], "madera": ["madera1", "madera2", "madera3", "madera4", "madera5", "madera_b1", "madera_b2", "madera_b3", "madera_b4"], "mision": ["mision"], "musica": ["musica1", "musica2", "musica3"], "noche": ["noche"], "ojon": ["ojon1", "ojon2"], "paso": ["paso1", "paso2", "paso3", "paso4", "paso5", "paso6", "paso_b1", "paso_b2", "paso_b3", "paso_b4", "paso_b5", "paso_b6"], "picar": ["picar1", "picar2", "picar3", "picar4", "picar5"], "piedra": ["piedra1", "piedra_c1", "piedra_c2", "piedra_c3", "piedra_c4"], "puerta": ["puerta1", "puerta2", "puerta_b1", "puerta_b2", "puerta_b3"], "tela": ["tela1", "tela2", "tela_b1", "tela_b2", "tela_b3", "tela_b4"], "tierra": ["tierra1", "tierra2", "tierra3", "tierra4", "tierra5", "tierra_b1", "tierra_b2", "tierra_b3", "tierra_b4"], "vidrio": ["vidrio1", "vidrio2", "vidrio3", "vidrio4", "vidrio5"]};let a=null,b=null;const l=document.getElementById('l');
for(const k in G){const h=document.createElement('h2');h.textContent=k;l.appendChild(h);for(const n of G[k]){const x=document.createElement('button');x.textContent=n;x.onclick=()=>{if(a){a.pause();b.classList.remove('on');}if(b===x){b=null;a=null;return;}a=new Audio(n+'.mp3');b=x;x.classList.add('on');a.onended=()=>{x.classList.remove('on');b=null;};a.play();};l.appendChild(x);}}
</script></body></html>

<style>

  #precarga::after { content: ''; position: absolute; inset: 0; background: rgba(10,16,48,.25); }
  @keyframes pcFondo { from { transform: scale(1) translateX(-2%); } to { transform: scale(1.08) translateX(2%); } }

(function () {
  var t0 = Date.now(), L = 'es';
  try { L = localStorage.getItem('bloxIdioma') || ((navigator.language || 'es').slice(0, 2)); } catch (e) {}
  if (['es', 'en', 'pt'].indexOf(L) < 0) L = 'en';

  document.getElementById('pcPresenta').textContent = TX[0];
  var barra = document.getElementById('pcBarra'), texto = document.getElementById('pcTexto'), N = 10, k;
  for (k = 0; k < N; k++) barra.appendChild(document.createElement('i'));
  var listo = false, avance = 0, frase = 0;

  var reloj = setInterval(function () {

    f.catch(function () {}).then(function () { setTimeout(function () { listo = true; }, 200); });
  });
})();
